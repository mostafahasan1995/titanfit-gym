name: ef-migration

# Generates an EF Core migration on a runner (no .NET SDK is needed on the developer machine).
# Run it from the Actions tab, download the "ef-migration" artifact and commit the files under
# src/Gym.Infrastructure/Persistence/Migrations.

on:
  workflow_dispatch:
    inputs:
      name:
        description: Migration name (PascalCase, e.g. AddMemberNotes)
        required: true
        default: InitialCreate
      replace:
        description: Delete the existing migrations first (only before the first release)
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  migration:
    name: Generate EF Core migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIGRATION_NAME: ${{ inputs.name }}
      EF_ARGS: >-
        --project src/Gym.Infrastructure/Gym.Infrastructure.csproj
        --startup-project src/Gym.Api/Gym.Api.csproj
        --context GymDbContext

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.15

      - name: Add the EF design package to the API (this run only, not committed)
        run: dotnet add src/Gym.Api/Gym.Api.csproj package Microsoft.EntityFrameworkCore.Design --version 10.0.15

      - name: Remove the existing migrations
        if: ${{ inputs.replace }}
        run: rm -rf src/Gym.Infrastructure/Persistence/Migrations

      - name: Add the migration
        run: dotnet ef migrations add "$MIGRATION_NAME" $EF_ARGS --output-dir Persistence/Migrations

      - name: Write the SQL script
        run: |
          dotnet ef migrations script --idempotent $EF_ARGS --output migration.sql
          cat migration.sql

      - name: Upload the migration
        uses: actions/upload-artifact@v7
        with:
          name: ef-migration
          path: |
            src/Gym.Infrastructure/Persistence/Migrations
            migration.sql
          if-no-files-found: error
          retention-days: 7
