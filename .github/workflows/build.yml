name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  windows:
    name: Build, test, publish (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Show .NET version
        run: dotnet --version

      - name: Restore
        run: dotnet restore TitanFit.slnx

      - name: Build (Release)
        run: dotnet build TitanFit.slnx --configuration Release --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/Gym.Tests/Gym.Tests.csproj --configuration Release --no-build
          --results-directory TestResults
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

      - name: Publish standalone exes (win-x64, self-contained, single file)
        run: |
          $common = @('--configuration', 'Release', '--runtime', 'win-x64', '--self-contained', '-p:PublishSingleFile=true')
          dotnet publish src/Gym.Api/Gym.Api.csproj @common --output publish/Gym.Api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($app in 'Gym.Admin', 'Gym.Reception', 'Gym.Cafeteria') {
            dotnet publish "src/$app/$app.csproj" @common -p:IncludeNativeLibrariesForSelfExtract=true --output "publish/$app"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($app in 'Gym.Api', 'Gym.Admin', 'Gym.Reception', 'Gym.Cafeteria') {
            Copy-Item "publish/$app/$app.exe" dist/
          }
          Get-ChildItem dist | Format-Table Name, @{ Name = 'Size (MB)'; Expression = { [math]::Round($_.Length / 1MB, 1) } } -AutoSize

      # Each exe loads its native and critical libraries (fonts, WPF, OpenCV + ZXing + QRCoder + sounds, SkiaSharp +
      # HarfBuzz + LiveCharts, receipt + XPS) and exits: no window, camera or printer. The bundles unpack into
      # bundle-extract/ for the next step. (The runner has the Visual C++ runtime; the clean-PC case is the next step.)
      - name: Self-test (published exes)
        env:
          DOTNET_BUNDLE_EXTRACT_BASE_DIR: ${{ github.workspace }}\bundle-extract
        run: |
          $failures = @()
          foreach ($app in 'Gym.Reception', 'Gym.Admin', 'Gym.Cafeteria') {
            $out = Join-Path $env:RUNNER_TEMP "$app-self-test.txt"
            $proc = Start-Process -FilePath (Resolve-Path "dist/$app.exe").Path -ArgumentList '--self-test' `
              -NoNewWindow -PassThru -RedirectStandardOutput $out -RedirectStandardError "$out.err"
            $null = $proc.Handle  # keeps the exit code readable after the process ends
            if (-not $proc.WaitForExit(180000)) {
              $proc.Kill()
              $failures += "${app} --self-test timed out"
              continue
            }
            $proc.WaitForExit()
            Write-Host "---- $app --self-test: exit code $($proc.ExitCode)"
            Get-Content $out, "$out.err" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }
            if ($proc.ExitCode -ne 0) { $failures += "${app} --self-test: exit code $($proc.ExitCode)" }
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

      # Which apps need the Microsoft Visual C++ runtime on a clean gym PC: the imports of each exe and of every native
      # file its bundle unpacks, read with dumpbin and listed. (WPF brings its own vcruntime140_cor3.dll.) The Station
      # setup installs the runtime with the Reception app (installer/station.iss): an app without a setup that installs
      # it fails here as soon as one of its native files imports it.
      - name: Native dependencies (Visual C++ runtime)
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found on the runner' }
          $vcRuntime = '^(msvcp140(_\d+|_atomic_wait|_codecvt_ids)?|vcruntime140(_1|_threads)?|concrt140|vcomp140|vccorlib140|mfc140u?)\.dll$'
          $setupInstallsIt = @('Gym.Reception')
          $failures = @()
          foreach ($app in 'Gym.Admin', 'Gym.Reception', 'Gym.Cafeteria') {
            $files = @(Get-Item "dist/$app.exe") + @(Get-ChildItem "bundle-extract/$app" -Recurse -File -Include *.dll, *.exe -ErrorAction SilentlyContinue)
            $needs = @()
            $lines = @()
            foreach ($file in $files) {
              $imports = @(& $dumpbin /nologo /dependents $file.FullName | ForEach-Object { if ($_ -match '^\s+(\S+\.dll)\s*$') { $Matches[1] } } | Sort-Object -Unique)
              if ($imports.Count -eq 0) { $failures += "${app}: dumpbin found no imports in $($file.Name)" }
              $vc = @($imports | Where-Object { $_ -match $vcRuntime })
              if ($vc.Count -gt 0) { $needs += "$($file.Name) imports $($vc -join ', ')" }
              $lines += "    $($file.Name): $(@($imports | Where-Object { $_ -notmatch '^api-ms-win-' }) -join ', ')"
            }
            $verdict = if ($needs.Count -gt 0) { "NEEDS the Visual C++ runtime ($($needs -join '; '))" } else { 'does not import the Visual C++ runtime' }
            Write-Host "${app}: $verdict"
            $lines | ForEach-Object { Write-Host $_ }
            if ($needs.Count -gt 0 -and $app -notin $setupInstallsIt) { $failures += "${app} needs the Visual C++ runtime, but no setup installs it for this app" }
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

      # Each app renders its login, server settings, every registered page, the control gallery and a dialog on
      # sample data (no server) and writes screenshots/<App>-<lang>.json listing them. A new page needs no change here.
      - name: Smoke screenshots (every page, EN and AR)
        run: |
          New-Item -ItemType Directory -Force screenshots, smoke-logs | Out-Null
          $out = (Resolve-Path screenshots).Path
          $failures = @()
          foreach ($app in 'Gym.Admin', 'Gym.Reception', 'Gym.Cafeteria') {
            $id = $app.Substring(4)
            foreach ($lang in 'en', 'ar') {
              $log = Join-Path $PWD "smoke-logs/$app-$lang"
              $exe = (Resolve-Path "dist/$app.exe").Path
              $proc = Start-Process -FilePath $exe -ArgumentList @('--smoke-screenshots', "`"$out`"", '--lang', $lang) `
                -NoNewWindow -PassThru -RedirectStandardOutput "$log.out.txt" -RedirectStandardError "$log.err.txt"
              $null = $proc.Handle  # keeps the exit code readable after the process ends
              if (-not $proc.WaitForExit(300000)) {
                $proc.Kill()
                $failures += "$app ($lang): timed out"
                continue
              }
              $proc.WaitForExit()
              Write-Host "---- $app ($lang): exit code $($proc.ExitCode)"
              Get-Content "$log.out.txt", "$log.err.txt" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }
              if ($proc.ExitCode -ne 0) {
                $failures += "$app ($lang): exit code $($proc.ExitCode)"
              }
              $manifestPath = Join-Path $out "$id-$lang.json"
              if (-not (Test-Path $manifestPath)) {
                $failures += "$app ($lang): no manifest $id-$lang.json"
                continue
              }
              $manifest = Get-Content $manifestPath -Raw -Encoding utf8 | ConvertFrom-Json
              if (@($manifest.screenshots).Count -lt 3) {
                $failures += "$app ($lang): only $(@($manifest.screenshots).Count) screenshots"
              }
              foreach ($shot in @($manifest.screenshots)) {
                $png = Join-Path $out $shot.file
                if (-not $shot.ok) {
                  $failures += "$app ($lang) $($shot.name): $((("$($shot.error)") -split "`n")[0])"
                } elseif (-not (Test-Path $png) -or (Get-Item $png).Length -lt 10KB) {
                  $failures += "$app ($lang) $($shot.name): missing or tiny PNG"
                } else {
                  Write-Host ("  OK: {0} ({1:N0} bytes)" -f $shot.file, (Get-Item $png).Length)
                }
              }
              foreach ($problem in @($manifest.textProblems | Where-Object { $_ })) { $failures += "$app ($lang) text: $problem" }
              foreach ($problem in @($manifest.unhandledErrors | Where-Object { $_ })) { $failures += "$app ($lang) unhandled: $problem" }
            }
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

      - name: Upload exes
        uses: actions/upload-artifact@v7
        with:
          name: titanfit-exes
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: Integration tests (PostgreSQL, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # GitHub service containers work only on Linux runners. This throwaway CI database is not a secret.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      GYM_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
      # The backup tests run the real pg_dump; it must be the server's major version (17), from the PGDG apt repo.
      GYM_TEST_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install the PostgreSQL 17 client (pg_dump, pg_restore)
        run: |
          # Drop any PGDG entry of the runner image (a second one with another key would break apt).
          (grep -rl apt.postgresql.org /etc/apt/sources.list.d/ 2>/dev/null || true) | xargs -r sudo rm -f
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-client-17
          "$GYM_TEST_PG_DUMP" --version

      - name: Integration tests (database + API)
        run: >
          dotnet test tests/Gym.IntegrationTests/Gym.IntegrationTests.csproj --configuration Release
          --results-directory TestResults
          --logger "trx;LogFileName=integration-test-results.trx"
          --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

  installers:
    name: Installers (Inno Setup)
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download exes
        uses: actions/download-artifact@v8
        with:
          name: titanfit-exes
          path: dist

      # PostgreSQL 17 binaries zip and Inno Setup, pinned with SHA-256 in installer/downloads.json.
      - name: Cache downloads
        uses: actions/cache@v6
        with:
          path: artifacts/downloads
          key: installer-downloads-${{ hashFiles('installer/downloads.json') }}

      # Microsoft's vc_redist.x64.exe permalink always serves the latest build (no fixed hash): cached for a month,
      # its Authenticode signature is checked on every build.
      - name: Month (cache key of the Visual C++ redistributable)
        id: month
        run: '"month=$(Get-Date -Format yyyy-MM)" | Add-Content $env:GITHUB_OUTPUT'

      - name: Cache the Visual C++ redistributable
        uses: actions/cache@v6
        with:
          path: artifacts/vcredist
          key: vcredist-x64-${{ steps.month.outputs.month }}

      - name: Build the setups
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./installer/build-installers.ps1 -ExesDir dist -OutDir artifacts/installers -Tag "$env:TAG"

      - name: Upload setups
        uses: actions/upload-artifact@v7
        with:
          name: titanfit-installers
          path: artifacts/installers/*
          if-no-files-found: error
          retention-days: 14

  install-smoke:
    name: Install smoke test (Windows)
    needs: installers
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download setups
        uses: actions/download-artifact@v8
        with:
          name: titanfit-installers
          path: artifacts/installers

      - name: Install, upgrade, uninstall, reinstall
        run: ./installer/tests/install-smoke.ps1 -InstallersDir artifacts/installers -LogDir artifacts/install-logs

      - name: Upload install logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-logs
          path: artifacts/install-logs
          if-no-files-found: warn
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [installers, install-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download setups
        uses: actions/download-artifact@v8
        with:
          name: titanfit-installers
          path: release

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l release
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "TitanFit $TAG" --generate-notes $prerelease
          fi
